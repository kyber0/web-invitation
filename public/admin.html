<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Organizer · Cleveth Kate</title><link rel="stylesheet" href="/style.css"><script type="module" src="/admin.js"></script></head><body><header><a class="brand" href="/">CK <span>ORGANIZER</span></a><button class="button" id="logout" hidden>Sign out</button></header><main class="admin-wrap"><p class="eyebrow">A CELEBRATION, BEAUTIFULLY ORGANIZED</p><h1 class="admin-title">The guest book.</h1><form id="login"><label>Organizer password<input type="password" name="password" autocomplete="current-password" required></label><button class="button">Sign in ↗</button></form><p id="message" role="status"></p><section id="dashboard" hidden><div class="stats" id="stats"></div><div class="admin-grid"><form id="add"><h3>A personal invitation</h3><label>Guest / family name<input name="name" maxlength="150" required></label><label>Reserved seats<input name="seats" type="number" min="1" max="30" value="1" required></label><button class="button">Create invitation ↗</button><p id="created" role="status"></p></form><div><div class="admin-head"><label>Find a guest<input id="search" type="search" placeholder="Search names"></label><button id="export" class="button">Export CSV</button></div><div id="guests"></div></div></div></section></main></body></html>
